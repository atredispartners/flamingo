version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
builds:
  - 
    env:
    - CGO_ENABLED=0
    ldflags:
      - -s -w -X "github.com/atredispartners/flamingo/cmd.Version={{.Version}}"  
    goos:
      - windows
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - 386
      - arm
      - arm64
    goarm:
      - 5
      - 6
      - 7
    ignore:         
      - goos: darwin
        goarch: arm     
      - goos: freebsd
        goarch: arm
signs:
  - id: default
    cmd: gpg
    args:
      - -u x@hdm.io
      - --output
      - $signature
      - --detach-sig
      - $artifact
    signature: ${artifact}.sig
    artifacts: checksum      
archives:
- formats: [binary]
  name_template: '{{ .ProjectName }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}-{{ if eq .Arch "386" }}x86{{ else if eq .Arch "arm64" }}aarch64{{ else }}{{ .Arch }}{{ end }}{{ .Arm }}'
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
